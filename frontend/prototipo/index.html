<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente de Ementas · protótipo de interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --vermelho:#C1423E; --amarelo:#FFB300; --verde:#00A94A; --azul:#2F55A4;
  --fundo:#FFFFFF; --lado:#F6F6F7; --sup:#FFFFFF; --sup2:#F1F1F3; --tinta:#1B1B1D; --suave:#6E6E76; --linha:#E6E6E9;
  --acao:#1B1B1D; --acao-txt:#FFFFFF; --marca:#FFE7A3;
  --ui:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --doc:"Literata",Georgia,"Times New Roman",serif;
}
[data-theme="dark"]{
  --azul:#5F8BEA;
  --fundo:#1F2023; --lado:#18191B; --sup:#26272B; --sup2:#2C2D32; --tinta:#EDEDEF; --suave:#9C9DA6; --linha:#34353B;
  --acao:#EDEDEF; --acao-txt:#18191B; --marca:#5C4708;
}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--fundo);color:var(--tinta);font-family:var(--ui);line-height:1.5;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--tinta);outline-offset:2px;border-radius:4px}
.so-claro{display:block}.so-escuro{display:none}
[data-theme="dark"] .so-claro{display:none}[data-theme="dark"] .so-escuro{display:block}
.app{display:grid;grid-template-columns:248px minmax(0,1fr) 430px;height:100vh}

/* barra lateral */
.lado{background:var(--lado);display:flex;flex-direction:column;min-height:0}
.marca{padding:20px 18px 6px}
.marca img{width:132px;height:auto}
.marca h1{font-weight:600;font-size:.95rem;margin:16px 0 0;letter-spacing:-.01em}
.marca p{margin:0;color:var(--suave);font-size:.8rem}
.nova{margin:14px 10px 6px;padding:7px 10px;border:0;background:none;border-radius:6px;text-align:left;font-weight:500;display:flex;gap:9px;align-items:center}
.nova:hover{background:var(--sup2)}
.hist{flex:1;overflow:auto;padding:0 10px 12px}
.hist h2{font-size:.76rem;font-weight:400;color:var(--suave);margin:16px 10px 4px}
.hist button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:6px}
.hist button:hover,.hist button.ativa{background:var(--sup2)}
.hist b{display:block;font-weight:400;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist span{font-size:.76rem;color:var(--suave)}
.pe{padding:10px 12px 14px;display:flex;align-items:center;gap:4px;font-size:.82rem}
.pe .quem{flex:1;color:var(--suave);padding-left:8px}
.mini{border:0;background:none;border-radius:6px;padding:4px 8px;font-size:.82rem;color:var(--suave)}
.mini:hover{background:var(--sup2);color:var(--tinta)}

/* centro */
.centro{display:flex;flex-direction:column;min-width:0;min-height:0}
.trilha{padding:18px 32px 14px;border-bottom:1px solid var(--linha)}
.trilha>div{max-width:720px;margin:0 auto}
.barra{position:relative;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--vermelho),var(--amarelo) 34%,var(--verde) 67%,var(--azul))}
.barra i{position:absolute;right:0;top:0;bottom:0;background:var(--linha);border-radius:0 3px 3px 0;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.barra svg{position:absolute;top:-7px;width:17px;height:17px;margin-left:-8px;transition:left .5s cubic-bezier(.2,.7,.2,1)}
.trilha ol{display:grid;grid-template-columns:repeat(7,1fr);margin:9px 0 0;padding:0;list-style:none}
.passo{font-size:.78rem;color:var(--suave);text-align:center;white-space:nowrap}
.passo.feito{color:var(--tinta)}
.passo.agora{color:var(--tinta);font-weight:600}
.fio{flex:1;overflow:auto;padding:30px 32px 10px;scroll-behavior:smooth}
.col{max-width:720px;margin:0 auto}
.vazio{margin:11vh 0 0}
.vazio h2{font-weight:600;font-size:1.7rem;line-height:1.2;letter-spacing:-.025em;margin:0 0 8px}
.vazio p{color:var(--suave);margin:0 0 26px;max-width:54ch}
.solta{border:1px dashed var(--linha);border-radius:12px;padding:22px}
.solta.sobre{border-color:var(--tinta);background:var(--sup2)}
.solta small{display:block;color:var(--suave);margin-top:12px;font-size:.8rem}
.btn{background:var(--acao);color:var(--acao-txt);border:1px solid var(--acao);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{opacity:.86}
.btn.sec{background:none;color:var(--tinta);border-color:var(--linha)}
.btn.sec:hover{opacity:1;background:var(--sup2)}
.acoes{display:flex;gap:8px;flex-wrap:wrap}

.msg{margin:0 0 26px;animation:entra .22s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}.fio{scroll-behavior:auto}.barra i,.barra svg{transition:none}}
.bot{display:grid;grid-template-columns:26px 1fr;gap:14px}
.bot>span img{width:26px;margin-top:5px}
.bot h3{font-weight:600;font-size:1rem;margin:0 0 6px;letter-spacing:-.01em}
.bot p{margin:0 0 10px}
.eu{display:flex;justify-content:flex-end}
.eu div{background:var(--sup2);border-radius:16px;padding:7px 14px;max-width:80%}
.pensa{color:var(--suave);font-size:.88rem;padding-top:3px}
.pensa ul{margin:0;padding:0}
.pensa li{list-style:none;margin:3px 0;display:flex;gap:10px;align-items:center}
.pensa i{width:6px;height:6px;border-radius:50%;background:var(--amarelo);flex:none}
.pensa li.ok i{background:var(--suave);opacity:.5}
table{border-collapse:collapse;width:100%;font-size:.9rem;margin:4px 0 12px}
th,td{text-align:left;padding:7px 12px 7px 0;border-bottom:1px solid var(--linha);vertical-align:top}
tr:last-child th,tr:last-child td{border-bottom:0}
th{font-weight:400;color:var(--suave);width:34%}
.pg{font-size:.78rem;color:var(--suave);margin-left:6px;white-space:nowrap;border-bottom:1px dotted var(--suave)}
.ops{margin:12px 0 6px;border:1px solid var(--linha);border-radius:10px;overflow:hidden}
.op{display:grid;grid-template-columns:22px 1fr;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--linha);background:none;padding:12px 14px;position:relative}
.op:first-child{border-top:0}
.op:hover:not(:disabled){background:var(--sup2)}
.op:disabled{cursor:default;color:var(--suave)}
.op.sel{color:var(--tinta);background:var(--sup2)}
.op.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tinta)}
.op .n{font-size:.82rem;color:var(--suave);font-variant-numeric:tabular-nums;padding-top:1px}
.op.sel .n{color:var(--tinta);font-weight:600}
.op b{font-weight:500}
.op small{display:block;color:var(--suave);margin-top:2px;font-size:.84rem}
.mais{display:block;font-size:.78rem;color:var(--suave);margin-top:5px}
.nota{font-size:.82rem;color:var(--suave)}
.alerta{border-left:3px solid var(--amarelo);padding:2px 0 2px 14px;margin:12px 0 16px}
.alerta b{display:block;font-weight:600;margin-bottom:2px}
.passou{font-size:.88rem;color:var(--suave)}
.passou ul{margin:6px 0 0;padding:0;list-style:none}
.passou li{margin:3px 0;padding-left:22px;position:relative}
.passou li::before{content:"";position:absolute;left:3px;top:.42em;width:9px;height:5px;border-left:1.6px solid var(--verde);border-bottom:1.6px solid var(--verde);transform:rotate(-45deg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--linha);background:none;border-radius:20px;padding:4px 12px;font-size:.82rem;color:var(--suave)}
.chip:hover{color:var(--tinta);border-color:var(--suave)}

.caixa{padding:8px 32px 14px}
.caixa form{max-width:720px;margin:0 auto;display:flex;gap:8px;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:7px 7px 7px 16px}
[data-theme="dark"] .caixa form{background:var(--sup)}
.caixa form:focus-within{border-color:var(--suave)}
.caixa input{flex:1;border:0;background:none;font:inherit;color:inherit;min-width:0;outline:none}
.caixa input::placeholder{color:var(--suave)}
.caixa p{max-width:720px;margin:8px auto 0;font-size:.74rem;color:var(--suave);text-align:center}

/* painel */
.painel{background:var(--fundo);border-left:1px solid var(--linha);display:flex;flex-direction:column;min-height:0}
.abas{display:flex;gap:2px;padding:14px 16px 10px;align-items:center}
.abas [data-aba]{border:0;background:none;padding:5px 11px;border-radius:6px;color:var(--suave);font-weight:500;font-size:.9rem}
.abas [data-aba]:hover{color:var(--tinta)}
.abas [data-aba][aria-selected="true"]{color:var(--tinta);background:var(--sup2)}
.abas .copiar{margin-left:auto}
.conteudo{flex:1;overflow:auto;padding:14px 26px 30px}
.folha{font-family:var(--doc);font-size:1rem;line-height:1.65}
.folha .cab{font-weight:600;margin:0 0 16px;letter-spacing:.01em}
.folha h4{font-family:var(--doc);font-size:1rem;font-weight:600;margin:18px 0 4px}
.folha p{margin:0 0 8px}
.folha .novo{background:var(--marca);box-shadow:0 0 0 2px var(--marca);border-radius:1px}
.folha .falta{color:var(--suave);font-family:var(--ui);font-size:.86rem}
.reg{font-size:.82rem}
.reg div{display:grid;grid-template-columns:44px 84px 1fr;gap:10px;padding:5px 0}
.reg time{color:var(--suave);font-variant-numeric:tabular-nums}
.reg em{font-style:normal;color:var(--suave)}
.reg .escolha em,.reg .escolha span{color:var(--tinta);font-weight:500}
.rodape-proto{font-size:.74rem;color:var(--suave);padding:0 26px 14px}
.so-estreito{display:none}

@media (max-width:1180px){
  .app{grid-template-columns:232px minmax(0,1fr)}
  .painel{position:fixed;right:0;top:0;bottom:0;width:min(430px,100vw);transform:translateX(100%);transition:transform .2s;z-index:5;box-shadow:-16px 0 48px -24px rgba(0,0,0,.6)}
  .painel.aberto{transform:none}
  .so-estreito{display:inline-block}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lado{display:none}
  .trilha,.fio,.caixa{padding-left:16px;padding-right:16px}
  .passo{font-size:0}.passo.agora{font-size:.76rem}
  .vazio h2{font-size:1.4rem}
}
</style>
</head>

  if(!pend||i<0||i>=pend.n)return false;
  const g=$(pend.id),fn=pend.fn;pend=null;
  g.querySelectorAll(".op").forEach((b,k)=>{b.disabled=true;if(k===i)b.classList.add("sel")});
  fn(i);return true;
}
col.addEventListener("click",e=>{
  const b=e.target.closest(".op");if(b&&pend&&b.parentNode.id===pend.id){const i=+b.dataset.i;eu(b.querySelector("span:last-child").firstChild.textContent.trim().slice(0,140));escolhe(i);return}
  const c=e.target.closest(".chip");if(c)pergunta(c.textContent);
});

function passo(n,fase){S.passo=n;S.fase=fase;pinta()}
function pinta(){
  $("trilha").innerHTML=PASSOS.map((p,i)=>`<li class="passo ${S.fim||i<S.passo?"feito":i===S.passo?"agora":""}"${i===S.passo&&!S.fim?' aria-current="step"':""}>${p}</li>`).join("");
  const pct=S.fim?100:(S.passo+.5)/7*100;$("resto").style.width=(100-pct)+"%";
  if(!$("sol").firstChild)$("sol").innerHTML=SOL;$("sol").firstChild.style.left=pct+"%";$("sol").firstChild.style.display=S.fim?"none":"";
  painel();
}

/* fluxo */
function recebe(nome){
  eu("Arquivo enviado: "+nome);$("atualNome").textContent="Consulta, duodécimo do Legislativo";sit("Lendo o voto");
  reg("arquivo",nome+", 24 páginas");passo(1,"lendo");dica("Lendo o voto…");
  pensa(["Convertendo 24 páginas em texto","Separando relatório, voto e parte dispositiva","Extraindo dados do processo e pontos decididos","Conferindo cada trecho citado contra a página de origem"],()=>{
    reg("modelo","Extração da ficha, prompt v0.1");reg("verificação","18 evidências conferidas, 0 rejeitadas");
    bot(`<h3>Ficha do caso</h3><table>${FICHA.linhas.map(l=>`<tr><th>${l[0]}</th><td>${l[1]}<span class="pg">p. ${l[2]}</span></td></tr>`).join("")}</table>
    <p class="nota">${FICHA.nao}</p><p class="nota">O voto já traz uma ementa nas páginas 18 e 19. Ela não é usada como fonte.</p>`);
    pedePonto("Encontrei 4 pontos decididos na resposta à consulta. Qual deles entra na ementa primeiro?");
  });
}
function restantes(){return PONTOS.map((p,i)=>i).filter(i=>!S.itens.some(x=>x.p===i))}
function pedePonto(txt){
  const r=restantes();passo(2,"ponto");sit("Aguardando o ponto");dica("Digite o número do ponto ou pergunte sobre o caso");
  bot(`<p>${txt}</p>`+opcoes(r.map(i=>`<b>${PONTOS[i].t}</b><small>${PONTOS[i].r}<span class="pg">p. 22</span></small>`),k=>{
    S.ponto=r[k];reg("escolha","Ponto: "+PONTOS[S.ponto].t);propoeTeses();
  })+`<div class="chips"><button class="chip">Qual é a diferença entre os pontos 2 e 4?</button></div>`);
}
function propoeTeses(){
  passo(3,"lendo");sit("Propondo teses");dica("Propondo teses…");
  pensa(["Redigindo a regra geral","Acrescentando norma, condição e consequência citadas no voto","Barrando nomes, valores e normas ausentes da ficha"],()=>{
    reg("modelo","Proposição de 4 teses, prompt v0.1");reg("verificação","Teses sem nome próprio e sem norma fora da ficha");
    const P=PONTOS[S.ponto];passo(3,"tese");sit("Aguardando a tese");dica("Digite o número da tese ou pergunte sobre o caso");
    bot(`<p>Quatro redações para este ponto, da mais geral à mais completa. Cada uma acrescenta um elemento à anterior.</p>`+
      opcoes(P.teses.map((t,i)=>`${t}<span class="mais">${NIVEIS[i]}</span>`).concat([`<b>Dispensar a tese deste ponto</b><small>Portaria Normativa TC nº 322/2026, art. 8º, parágrafo único</small>`]),k=>{
        S.tese=k<4?P.teses[k]:null;reg("escolha",k<4?"Tese "+(k+1)+" ("+NIVEIS[k].toLowerCase()+")":"Tese dispensada");buscaTermos();
      })+`<div class="chips"><button class="chip">Por que a tese 4 cita um elemento que as outras não citam?</button></div>`);
  });
}
function buscaTermos(){
  passo(4,"lendo");sit("Buscando no tesauro");dica("Buscando termos…");
  pensa(["Buscando no Tesauro de Contas Nacional por texto e por sentido","Ordenando os candidatos","Conferindo se todos existem no tesauro"],()=>{
    reg("tesauro","30 candidatos recuperados, 5 sugeridos");reg("verificação","5 de 5 identificadores existem no tesauro");
    const P=PONTOS[S.ponto];passo(4,"termo");sit("Aguardando o termo");dica("Digite o número do termo ou pergunte sobre eles");
    bot(`<p>Termos sugeridos para este ponto. Só aparecem termos que existem no tesauro.</p>`+
      opcoes(P.termos.map(t=>`<b>${t[0]}</b><small>Termo genérico: ${t[1]}</small>`),k=>{
        S.itens.push({p:S.ponto,tese:S.tese,termo:P.termos[k][0],tg:P.termos[k][1]});S.novo=S.ponto;
        reg("escolha","Termo: "+P.termos[k][0]);monta();
      })+`<p class="nota">Neste protótipo os termos são ilustrativos. A versão real consulta a base do tesauro.</p>`);
  });
}
function ementa(){
  const termos=[...new Set(S.itens.flatMap(x=>[x.tg,x.termo]))];
  const cab="EMENTA: CONSULTA. "+termos.map(t=>t.toUpperCase()+". ").join("")+"ART. 29-A DA CONSTITUIÇÃO FEDERAL. CONHECIMENTO. RESPOSTA.";
  let n=1;const E={cab,caso:[n++,CASO],razoes:S.itens.map(x=>[n++,PONTOS[x.p].razao,x.p]),disp:[n++,"Consulta conhecida e respondida. Proposição de Enunciado de Prejulgado."],teses:S.itens.filter(x=>x.tese).map(x=>[n++,x.tese,x.p])};
  return E;
}
function textoEmenta(){
  const E=ementa();let t=E.cab+"\n\nI. CASO EM EXAME\n"+E.caso[0]+". "+E.caso[1]+"\n\nII. RAZÕES DE DECIDIR\n"+E.razoes.map(r=>r[0]+". "+r[1]).join("\n")+"\n\nIII. DISPOSITIVO\n"+E.disp[0]+". "+E.disp[1];
  if(E.teses.length)t+="\n\nIV. TESE DE JULGAMENTO\n"+E.teses.map(r=>r[0]+". "+r[1]).join("\n");
  return t;
}
function monta(){
  passo(5,"lendo");sit("Montando a ementa");dica("Montando a ementa…");
  pensa(["Montando o cabeçalho do termo amplo ao específico","Redigindo caso em exame e razões de decidir a partir da ficha","Aplicando a expressão padronizada do dispositivo"],()=>{
    reg("modelo","Caso em exame e razões, prompt v0.1");reg("código","Cabeçalho, dispositivo e numeração montados sem modelo");
    passo(5,"mais");sit("Ementa com "+S.itens.length+" ponto(s)");dica("Responda 1 ou 2, ou pergunte sobre o caso");
    abre("ementa");
    const r=restantes();
    if(!r.length){bot(`<p>Os 4 pontos já estão na ementa. Vou fazer a verificação final.</p>`);verifica();return}
    bot(`<p>A ementa foi atualizada no painel ao lado, com o trecho novo destacado. Deseja adicionar outro ponto?</p>`+
      opcoes([`<b>Sim, adicionar outro ponto</b><small>Restam ${r.length}. A ficha é reaproveitada.</small>`,`<b>Não, concluir a ementa</b><small>Segue para a verificação final.</small>`],k=>{
        reg("escolha",k?"Concluir":"Adicionar outro ponto");
        if(k===0)pedePonto("Qual ponto entra agora?");else verifica();
      }));
  });
}
function verifica(){
  S.novo=null;passo(6,"lendo");sit("Verificando");dica("Verificando…");
  pensa(["Comparando a fundamentação com a parte dispositiva do voto","Procurando no voto cada norma e precedente citados na ementa","Aplicando as regras da Portaria Normativa TC nº 322/2026"],()=>{
    reg("verificação","Verificação final: 1 ponto a conferir, 5 regras atendidas");
    S.fim=true;passo(7,"fim");sit("Ementa concluída, "+S.itens.length+" ponto(s)");dica("Pergunte sobre o caso ou comece uma nova ementa");
    const fora=S.itens.some(x=>/Acórdão/.test(x.tese||""));
    bot(`<h3>Ementa concluída</h3><p>Confira antes de usar: 1 ponto.</p>
    <div class="alerta"><b>Resposta à consulta e Enunciado de Prejulgado têm redações diferentes</b>Os itens 2 e 3 da resposta<span class="pg">p. 22</span> não coincidem com os itens 2 e 3 do enunciado proposto<span class="pg">p. 23</span>: o enunciado omite o trecho final do item 2 e as referências aos acórdãos. Confira qual redação deve orientar a tese.</div>
    <div class="passou">Regras atendidas<ul><li>Normas e precedentes da ementa localizados no voto</li><li>Dispositivo igual ao resultado registrado na ficha</li><li>Cabeçalho só com termos nominais (art. 4º, II)</li><li>Sem dados de pessoas naturais (art. 10, § 2º)</li><li>${fora?"Tese cita precedente do próprio voto; avalie se deve ir para as referências finais (art. 10, § 1º)":"Teses compreensíveis sem referência ao caso (art. 8º, I)"}</li></ul></div>
    <div class="acoes" style="margin-top:18px"><button class="btn" onclick="copia(this)">Copiar a ementa final</button><button class="btn sec" onclick="exporta()">Exportar a conversa</button><button class="btn sec" onclick="inicio()">Começar nova ementa</button></div>`);
    abre("ementa");
  });
}
function pergunta(q){
  eu(q);reg("pergunta",q.slice(0,60));
  let r;
  if(/2 e 4|pontos 2/.test(q))r=`O ponto 2 trata da natureza do art. 29-A: ele é um teto de despesa e, por isso, não gera direito ao valor máximo <span class="pg">Voto, p. 22</span>. O ponto 4 trata da regra de cálculo quando os dois valores são conhecidos: aplica-se o menor entre o teto constitucional e o montante da Lei Orçamentária <span class="pg">Voto, p. 22</span>. O ponto 4 é consequência prática do ponto 2.`;
  else if(/tese 4/.test(q))r=`O quarto nível acrescenta a consequência prática ou o precedente que o próprio voto cita na resposta à consulta <span class="pg">Voto, p. 22</span>. Ele não muda a regra da tese 1; apenas a torna mais completa. Se preferir um enunciado curto para o repositório de jurisprudência, as teses 1 e 2 bastam.`;
  else r=`Neste protótipo a conversa responde apenas às perguntas sugeridas. Na versão real, a resposta usa somente o voto e a ficha, cita seção e página e não avança a etapa.`;
  bot(`<p>${r}</p><p class="nota">A etapa continua aberta. Escolha uma opção quando quiser.</p>`);
}
$("form").onsubmit=e=>{
  e.preventDefault();const v=$("txt").value.trim();if(!v)return;$("txt").value="";
  if(S.fase==="voto"){bot(`<p>Primeiro envie o voto pelo botão acima ou use o voto de exemplo.</p>`);return}
  if(/^\d+$/.test(v)&&pend){const g=$(pend.id),b=g.querySelectorAll(".op")[+v-1];if(b){eu(v);escolhe(+v-1);return}eu(v);bot(`<p>Não há opção ${esc(v)}. Escolha de 1 a ${pend.n}.</p>`);return}
  pergunta(v);
};

/* painel */
function abre(a){aba=a;painel()}
function painel(){
  document.querySelectorAll(".abas [data-aba]").forEach(b=>b.setAttribute("aria-selected",b.dataset.aba===aba));
  const c=$("conteudo");
  if(aba==="ficha"){c.innerHTML=S.passo<2?`<p class="nota">A ficha aparece aqui depois da leitura do voto.</p>`:`<table>${FICHA.linhas.map(l=>`<tr><th>${l[0]}</th><td>${l[1]}<span class="pg">p. ${l[2]}</span></td></tr>`).join("")}</table><p class="nota">${FICHA.nao}</p>`;return}
  if(aba==="registro"){c.innerHTML=S.reg.length?`<div class="reg">${S.reg.map(r=>`<div class="${r[1]==="escolha"?"escolha":r[1]==="verificação"?"verif":""}"><time>${r[0]}</time><em>${r[1]}</em><span>${esc(r[2])}</span></div>`).join("")}</div><p class="nota" style="margin-top:12px">Cada chamada de modelo, verificação e escolha fica registrada com a versão do prompt.</p>`:`<p class="nota">Nenhum evento ainda.</p>`;return}
  if(!S.itens.length){c.innerHTML=`<div class="folha"><p class="falta">A ementa é montada aqui à medida que você escolhe ponto, tese e termo. Seções: cabeçalho, caso em exame, razões de decidir, dispositivo e tese de julgamento.</p></div>`;return}
  const E=ementa(),m=p=>p===S.novo?' class="novo"':"";
  c.innerHTML=`<div class="folha"><p class="cab">${E.cab}</p><h4>I. CASO EM EXAME</h4><p>${E.caso[0]}. ${E.caso[1]}</p>
  <h4>II. RAZÕES DE DECIDIR</h4>${E.razoes.map(r=>`<p>${r[0]}. <span${m(r[2])}>${r[1]}</span></p>`).join("")}
  <h4>III. DISPOSITIVO</h4><p>${E.disp[0]}. ${E.disp[1]}</p>
  ${E.teses.length?`<h4>IV. TESE DE JULGAMENTO</h4>`+E.teses.map(r=>`<p>${r[0]}. <span${m(r[2])}>${r[1]}</span></p>`).join(""):`<p class="falta">Tese de julgamento dispensada (art. 8º, parágrafo único).</p>`}</div>`;
}
document.querySelectorAll(".abas [data-aba]").forEach(b=>b.onclick=()=>abre(b.dataset.aba));
function copia(b){
  if(!S.itens.length){b.textContent="Nada a copiar";setTimeout(()=>b.textContent=b.id?"Copiar ementa":"Copiar a ementa final",1400);return}
  const t=textoEmenta(),fim=()=>{const o=b.textContent;b.textContent="Ementa copiada";reg("escolha","Ementa copiada");setTimeout(()=>b.textContent=o,1600)};
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(fim).catch(()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();fim()});
}
function exporta(){
  const t=textoEmenta()+"\n\n--- REGISTRO ---\n"+S.reg.map(r=>r.join("  ")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download="ementa-99000002-0.txt";a.click();
}
$("copiar").onclick=e=>copia(e.target);
$("nova").onclick=inicio;
$("arq").onchange=e=>{if(e.target.files[0])recebe(e.target.files[0].name);e.target.value=""};
$("tema").onclick=e=>{const d=document.documentElement,n=d.dataset.theme==="dark"?"light":"dark";d.dataset.theme=n;e.target.textContent=n==="dark"?"Claro":"Escuro"};
let f=15.5;$("maior").onclick=()=>{f=Math.min(19,f+1);document.documentElement.style.fontSize=f+"px"};$("menor").onclick=()=>{f=Math.max(13,f-1);document.documentElement.style.fontSize=f+"px"};
$("abrePainel").onclick=()=>$("painel").classList.add("aberto");$("fechaPainel").onclick=()=>$("painel").classList.remove("aberto");
inicio();
</script>
</body>
