services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ementas
      POSTGRES_USER: ementas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ementas_dev}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./scripts/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ementas -d ementas"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ementas:${POSTGRES_PASSWORD:-ementas_dev}@db:5432/ementas
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
